<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Company Research Dashboard — compare companies side-by-side across 12 key parameters." />
  <title>Company Research Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07080f;
      --card: rgba(255,255,255,0.04);
      --card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.09);
      --border-accent: rgba(124,58,237,0.45);
      --accent: #7c3aed;
      --accent2: #2563eb;
      --accent3: #06b6d4;
      --green: #10b981;
      --pink: #ec4899;
      --text: #f1f5f9;
      --muted: #64748b;
      --muted2: #94a3b8;
      --radius: 18px;
      --tag-bg: rgba(124,58,237,0.15);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Orbs */
    .orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .orb { position: absolute; border-radius: 50%; filter: blur(130px); opacity: 0.28; animation: drift 14s ease-in-out infinite alternate; }
    .orb-1 { width: 500px; height: 500px; background: var(--accent); top: -160px; left: -160px; }
    .orb-2 { width: 420px; height: 420px; background: var(--accent2); bottom: -120px; right: -120px; animation-delay: -5s; }
    .orb-3 { width: 340px; height: 340px; background: var(--accent3); top: 40%; left: 45%; animation-delay: -9s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(50px,35px) scale(1.1); } }

    /* Layout */
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* Nav */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 48px;
      background: rgba(7,8,15,0.7); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 200;
    }
    .nav-brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .back-link {
      font-size: 0.75rem;
      color: var(--muted2);
      text-decoration: none;
      transition: color 0.2s;
      margin-bottom: 2px;
    }
    .back-link:hover {
      color: var(--accent3);
    }
    .nav-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin: 0;
    }
    .nav-title span {
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-subtitle {
      color: var(--muted2);
      font-size: 0.78rem;
      font-weight: 400;
      margin: 0;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .count-badge {
      background: var(--tag-bg); border: 1px solid var(--border-accent);
      color: #a78bfa; font-size: 0.78rem; font-weight: 600;
      padding: 4px 12px; border-radius: 100px;
    }

    /* Btn */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px; border-radius: 12px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; border: none; transition: transform 0.2s, box-shadow 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 6px 28px rgba(124,58,237,0.4); }
    .btn-primary:hover { box-shadow: 0 10px 36px rgba(124,58,237,0.55); }
    .btn-ghost { background: var(--card); color: var(--muted2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--card-hover); color: var(--text); }
    .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }

    /* Search bar */
    .search-bar {
      padding: 24px 48px 0;
    }
    .search-input {
      width: 100%; max-width: 420px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 18px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.88rem;
      outline: none; transition: border-color 0.2s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: rgba(124,58,237,0.5); }

    /* Grid */
    .grid-wrapper { padding: 28px 48px 60px; overflow-x: auto; }
    .company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }
    .empty-state {
      grid-column: 1/-1; text-align: center; padding: 80px 24px;
      color: var(--muted);
    }
    .empty-icon { font-size: 3.5rem; margin-bottom: 16px; }
    .empty-state p { font-size: 1rem; }

    /* Company card */
    .company-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
      display: flex; flex-direction: column;
    }
    .company-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-accent);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    /* Card header */
    .card-header {
      padding: 24px 24px 18px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .card-header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .company-name { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
    .industry-tag {
      background: var(--tag-bg); border: 1px solid var(--border-accent);
      color: #c4b5fd; font-size: 0.72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 100px; white-space: nowrap; flex-shrink: 0;
    }
    .website-link {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--accent3); font-size: 0.78rem; text-decoration: none;
      margin-top: 6px; transition: opacity 0.2s;
    }
    .website-link:hover { opacity: 0.75; }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; }

    /* Card body */
    .card-body { padding: 0 24px; flex: 1; }

    /* Param row */
    .param-section { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .param-section:last-child { border-bottom: none; }
    .param-label {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 1.2px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
    }
    .param-value { font-size: 0.88rem; color: var(--text); line-height: 1.6; }
    .param-value.muted { color: var(--muted2); font-style: italic; }

    /* Inline stats */
    .stats-row { display: flex; gap: 24px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .stat-item { }
    .stat-item .param-label { margin-bottom: 3px; }
    .stat-item .param-value { font-size: 0.92rem; font-weight: 600; }

    /* Tags */
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tag {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 8px; padding: 3px 10px; font-size: 0.75rem; color: var(--muted2);
    }

    /* News bullets */
    .bullets { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .bullets li {
      font-size: 0.82rem; color: var(--muted2); line-height: 1.5;
      padding-left: 14px; position: relative;
    }
    .bullets li::before {
      content: '▸'; position: absolute; left: 0;
      color: var(--accent3); font-size: 0.7rem; top: 2px;
    }

    /* Revenue / founded highlight */
    .highlight-value {
      font-weight: 700; font-size: 1rem;
      background: linear-gradient(135deg,#a78bfa,#60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      align-items: center; justify-content: center; padding: 24px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #0e0f1c; border: 1px solid var(--border);
      border-radius: 22px; width: 100%; max-width: 680px;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 30px 100px rgba(0,0,0,0.7);
      animation: popIn 0.25s ease;
    }
    @keyframes popIn { from { opacity:0; transform:scale(0.94) translateY(20px); } to { opacity:1; transform:none; } }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 28px 20px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: #0e0f1c; z-index: 2;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .modal-close {
      background: none; border: none; color: var(--muted); font-size: 1.4rem;
      cursor: pointer; transition: color 0.2s; line-height: 1; padding: 4px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .modal-body .full { grid-column: 1/-1; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted2); }
    .form-input, .form-textarea {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.88rem;
      outline: none; transition: border-color 0.2s;
    }
    .form-input:focus, .form-textarea:focus { border-color: rgba(124,58,237,0.55); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .modal-footer {
      padding: 16px 28px 24px; display: flex; justify-content: flex-end; gap: 10px;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav, .search-bar, .grid-wrapper { padding-left: 20px; padding-right: 20px; }
      .modal-body { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .nav-subtitle { display: none; }
      .nav-title { font-size: 1.1rem; }
      nav { padding: 14px 20px; }
    }
  </style>
</head>
<body>
<div class="orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="page">
  <nav>
    <div class="nav-brand">
      <a href="../index.html" class="back-link">← Back to LocalKit</a>
      <h1 class="nav-title">Company <span>Research Dashboard</span></h1>
      <p class="nav-subtitle">Compare companies side-by-side across 12 key parameters</p>
    </div>
    <div class="nav-right">
      <span class="count-badge" id="company-count">0 companies</span>
      <button class="btn btn-primary" onclick="openModal()" id="add-btn">＋ Add Company</button>
    </div>
  </nav>

  <div class="search-bar">
    <input class="search-input" type="search" id="search" placeholder="🔍  Search by company name or industry…" oninput="renderCards()" />
  </div>

  <div class="grid-wrapper">
    <div class="company-grid" id="company-grid"></div>
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-text">
    <div class="modal-header">
      <div class="modal-title" id="modal-title-text">Add Company</div>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-index" value="-1" />
      <div class="form-group full">
        <label class="form-label" for="f-name">Company Name *</label>
        <input class="form-input" id="f-name" placeholder="e.g. Acme Corp" />
      </div>
      <div class="form-group full">
        <label class="form-label" for="f-about">About Company</label>
        <textarea class="form-textarea" id="f-about" placeholder="Brief description of what the company does…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-industry">Industry</label>
        <input class="form-input" id="f-industry" placeholder="e.g. Marketing & Advertising" />
      </div>
      <div class="form-group">
        <label class="form-label" for="f-employees">Employee Count</label>
        <input class="form-input" id="f-employees" placeholder="e.g. 51-200" />
      </div>
      <div class="form-group">
        <label class="form-label" for="f-hq">HQ Location</label>
        <input class="form-input" id="f-hq" placeholder="e.g. New York, USA" />
      </div>
      <div class="form-group">
        <label class="form-label" for="f-founded">Founded Year</label>
        <input class="form-input" id="f-founded" placeholder="e.g. 2001" />
      </div>
      <div class="form-group">
        <label class="form-label" for="f-revenue">Revenue</label>
        <input class="form-input" id="f-revenue" placeholder="e.g. USD 45-60 million" />
      </div>
      <div class="form-group">
        <label class="form-label" for="f-website">Website</label>
        <input class="form-input" id="f-website" placeholder="e.g. www.example.com" />
      </div>
      <div class="form-group full">
        <label class="form-label" for="f-locations">Operating Locations</label>
        <input class="form-input" id="f-locations" placeholder="e.g. USA, Canada, UK (comma-separated)" />
      </div>
      <div class="form-group full">
        <label class="form-label" for="f-services">Services</label>
        <input class="form-input" id="f-services" placeholder="e.g. Analytics, Design, Sourcing (comma-separated)" />
      </div>
      <div class="form-group full">
        <label class="form-label" for="f-news">Recent News</label>
        <textarea class="form-textarea" id="f-news" placeholder="Enter recent news items, one per line…"></textarea>
      </div>
      <div class="form-group full">
        <label class="form-label" for="f-investment">Investment Plans / New Opportunities</label>
        <textarea class="form-textarea" id="f-investment" placeholder="Enter investment plans, one per line…"></textarea>
      </div>
      <div class="form-group full">
        <label class="form-label" for="f-acquisitions">Acquisitions</label>
        <textarea class="form-textarea" id="f-acquisitions" placeholder="Describe recent acquisitions…"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCompany()">Save Company</button>
    </div>
  </div>
</div>

<script>
  const FIELDS = ['name','about','industry','employees','hq','founded','revenue','website','locations','services','news','investment','acquisitions'];

  let companies = JSON.parse(localStorage.getItem('researchCompanies') || '[]');

  // Seed with LG&P if empty
  if (companies.length === 0) {
    companies = [{
      name: "LG&P In-Store Agency",
      about: "A brand and retail marketing agency that works with major retailers and brand manufacturers. Services range from shopper research to design and manufacturing execution, with products such as point of purchase displays. LG&P is the parent company of LeanPie, a UK based company providing global sourcing and low-cost production.",
      industry: "Marketing & Advertising",
      employees: "51-200",
      hq: "Paramus, New Jersey, USA",
      founded: "2001",
      revenue: "USD 45-60 million",
      website: "www.lginstore.com",
      locations: "USA,Canada,China,UK",
      services: "Shopper & Retailer Insights,Trend Tracking & Analysis,Shopper Journey Mapping,Big Data Analytics,Electronics & Digital,Dynamic Management,Value Sourcing,Install Solutions",
      news: "In November 2019, LG&P collaborated with Macy's and Perch Interactive to deliver an engaging customized experience at 50 Macy's stores in the new Macy's Fragrance Bar.\nIn August 2019, Mike Nigai (founder and CEO of In-Store Focus) and his team joined the LG&P Group of Companies.",
      investment: "LG&P plans to develop unique and integrated solutions to drive transactions on the shopper's terms.\nThe company plans to design and produce shopper environments and experiences that create desired connections between brands and consumers.",
      acquisitions: "In January 2019, LG&P acquired Synergy Events, a company that develops and executes retail events and experiences, prompted by the growing trend at retail to create competitive advantage through enhanced shopper experiences."
    }];
    save();
  }

  function save() {
    localStorage.setItem('researchCompanies', JSON.stringify(companies));
  }

  function renderCards() {
    const query = document.getElementById('search').value.toLowerCase();
    const grid = document.getElementById('company-grid');
    const filtered = companies.filter(c =>
      c.name.toLowerCase().includes(query) ||
      (c.industry || '').toLowerCase().includes(query)
    );

    document.getElementById('company-count').textContent =
      companies.length + ' compan' + (companies.length === 1 ? 'y' : 'ies');

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🏢</div><p>${query ? 'No companies match your search.' : 'No companies yet. Click <strong>＋ Add Company</strong> to get started.'}</p></div>`;
      return;
    }

    grid.innerHTML = filtered.map((c, i) => {
      const realIdx = companies.indexOf(c);
      const locs = c.locations ? c.locations.split(',').map(s=>s.trim()).filter(Boolean) : [];
      const svcs = c.services ? c.services.split(',').map(s=>s.trim()).filter(Boolean) : [];
      const newsBullets = c.news ? c.news.split('\n').filter(Boolean) : [];
      const invBullets = c.investment ? c.investment.split('\n').filter(Boolean) : [];
      const websiteDisplay = c.website || '';
      const websiteHref = websiteDisplay.startsWith('http') ? websiteDisplay : 'https://' + websiteDisplay;

      return `
      <article class="company-card" id="card-${realIdx}">
        <div class="card-header">
          <div class="card-header-top">
            <div class="company-name">${esc(c.name)}</div>
            ${c.industry ? `<span class="industry-tag">${esc(c.industry)}</span>` : ''}
          </div>
          ${websiteDisplay ? `<a class="website-link" href="${websiteHref}" target="_blank" rel="noopener">🌐 ${esc(websiteDisplay)}</a>` : ''}
          <div class="card-actions">
            <button class="btn btn-ghost" style="padding:6px 14px;font-size:0.78rem;" onclick="editCompany(${realIdx})">✏️ Edit</button>
            <button class="btn btn-danger" style="padding:6px 14px;font-size:0.78rem;" onclick="deleteCompany(${realIdx})">🗑 Remove</button>
          </div>
        </div>
        <div class="card-body">
          ${c.about ? `
          <div class="param-section">
            <div class="param-label">About</div>
            <div class="param-value" style="font-size:0.82rem;color:var(--muted2);">${esc(c.about)}</div>
          </div>` : ''}

          <div class="stats-row">
            ${c.employees ? `<div class="stat-item"><div class="param-label">Employees</div><div class="param-value">👥 ${esc(c.employees)}</div></div>` : ''}
            ${c.founded ? `<div class="stat-item"><div class="param-label">Founded</div><div class="param-value highlight-value">${esc(c.founded)}</div></div>` : ''}
            ${c.revenue ? `<div class="stat-item"><div class="param-label">Revenue</div><div class="param-value highlight-value">${esc(c.revenue)}</div></div>` : ''}
          </div>

          ${c.hq ? `
          <div class="param-section">
            <div class="param-label">Headquarters</div>
            <div class="param-value">📍 ${esc(c.hq)}</div>
          </div>` : ''}

          ${locs.length ? `
          <div class="param-section">
            <div class="param-label">Operating Locations</div>
            <div class="tags">${locs.map(l=>`<span class="tag">🌍 ${esc(l)}</span>`).join('')}</div>
          </div>` : ''}

          ${svcs.length ? `
          <div class="param-section">
            <div class="param-label">Services</div>
            <div class="tags">${svcs.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>
          </div>` : ''}

          ${newsBullets.length ? `
          <div class="param-section">
            <div class="param-label">Recent News</div>
            <ul class="bullets">${newsBullets.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
          </div>` : ''}

          ${invBullets.length ? `
          <div class="param-section">
            <div class="param-label">Investment Plans / New Opportunities</div>
            <ul class="bullets">${invBullets.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
          </div>` : ''}

          ${c.acquisitions ? `
          <div class="param-section">
            <div class="param-label">Acquisitions</div>
            <div class="param-value" style="font-size:0.82rem;color:var(--muted2);">${esc(c.acquisitions)}</div>
          </div>` : ''}
        </div>
      </article>`;
    }).join('');
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function openModal(idx = -1) {
    document.getElementById('edit-index').value = idx;
    document.getElementById('modal-title-text').textContent = idx === -1 ? 'Add Company' : 'Edit Company';
    const ids = ['name','about','industry','employees','hq','founded','revenue','website','locations','services','news','investment','acquisitions'];
    if (idx === -1) {
      ids.forEach(id => { const el = document.getElementById('f-'+id); if(el) el.value = ''; });
    } else {
      const c = companies[idx];
      ids.forEach(id => { const el = document.getElementById('f-'+id); if(el) el.value = c[id] || ''; });
    }
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  function saveCompany() {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { alert('Company name is required.'); return; }
    const ids = ['name','about','industry','employees','hq','founded','revenue','website','locations','services','news','investment','acquisitions'];
    const obj = {};
    ids.forEach(id => { obj[id] = document.getElementById('f-'+id).value.trim(); });
    const idx = parseInt(document.getElementById('edit-index').value);
    if (idx === -1) companies.push(obj); else companies[idx] = obj;
    save(); closeModal(); renderCards();
  }

  function editCompany(idx) { openModal(idx); }

  function deleteCompany(idx) {
    if (!confirm(`Remove "${companies[idx].name}" from the dashboard?`)) return;
    companies.splice(idx, 1); save(); renderCards();
  }

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  renderCards();
</script>
</body>
</html>
